<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Rekcal ♡</title>

    <link rel="stylesheet" href="page2.css">
</head>

<body>

    <main class="desktop">

        <!-- =========================
             MAC MENU BAR
        ========================== -->

        <div class="menu-bar">

            <div class="menu-left">
                <span class="apple"></span>
                <span>Mymeo</span>
                <span>File</span>
                <span>Edit</span>
                <span>View</span>
                <span>Go</span>
                <span>Window</span>
                <span>Help</span>
            </div>

            <div class="menu-right">
                <span>Wi-Fi</span>
                <span>🔋</span>
                <span id="menu-time">00:00</span>
            </div>

        </div>


        <!-- =========================
             DESKTOP CONTENT
        ========================== -->

        <section class="desktop-grid">


            <!-- HÌNH 1 -->
            <div class="card photo-card photo-1">
                <img src="photo1.jpg" alt="Ảnh của hai đứa">
            </div>


            <!-- MUSIC PLAYER -->
<div class="card music-player">

    <div class="music-title">
        ♫ Apple Music ♫
    </div>

    <div class="song-name">
        Back to December (Taylor's Version)
    </div>

    <div class="artist-name">
        Taylor Swift
    </div>

    <div class="music-progress">

        <span>0:00</span>

        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <span>4:54</span>

    </div>

    <div class="music-controls">

        <button
            id="backward"
            type="button">
            ◀◀
        </button>

        <button
            class="play-button"
            id="play-button"
            type="button">
            ▶
        </button>

        <button
            id="forward"
            type="button">
            ▶▶
        </button>

    </div>

</div>


            <!-- HÌNH 2 -->
            <div class="card photo-card photo-2">
                <img src="photo2.jpg" alt="Ảnh của hai đứa">
            </div>


            <!-- 4 APP / FILE -->
            <div class="apps-area">

                <div class="app-item">
                    <div class="app-icon">♡</div>
                    <div class="app-name">APP 1</div>
                </div>

                <div class="app-item">
                    <div class="app-icon">♡</div>
                    <div class="app-name">APP 2</div>
                </div>

                <div class="app-item">
                    <div class="app-icon">♡</div>
                    <div class="app-name">APP 3</div>
                </div>

                <div class="app-item">
                    <div class="app-icon">♡</div>
                    <div class="app-name">APP 4</div>
                </div>

            </div>


            <!-- HÌNH 3 -->
            <div class="card photo-card photo-3">
                <img src="photo3.jpg" alt="Ảnh của hai đứa">
            </div>


            <!-- CALENDAR -->
            <div class="card calendar">

                <div class="calendar-header">
                    <span>October</span>
                    <span>2026</span>
                </div>

                <div class="calendar-weekdays">
                    <span>MON</span>
                    <span>TUE</span>
                    <span>WED</span>
                    <span>THU</span>
                    <span>FRI</span>
                    <span>SAT</span>
                    <span>SUN</span>
                </div>

                <div class="calendar-days">

                    <span></span>
                    <span></span>
                    <span></span>

                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>

                    <span>5</span>
                    <span class="heart-day">6</span>
                    <span>7</span>
                    <span>8</span>
                    <span>9</span>
                    <span>10</span>
                    <span>11</span>

                    <span>12</span>
                    <span>13</span>
                    <span>14</span>
                    <span>15</span>
                    <span>16</span>
                    <span>17</span>
                    <span>18</span>

                    <span>19</span>
                    <span>20</span>
                    <span>21</span>
                    <span>22</span>
                    <span>23</span>
                    <span>24</span>
                    <span>25</span>

                    <span>26</span>
                    <span>27</span>
                    <span>28</span>
                    <span>29</span>
                    <span>30</span>
                    <span>31</span>

                </div>

            </div>

        </section>


        <!-- =========================
             MAC DOCK
        ========================== -->

        <div class="dock">

            <div class="dock-item">⌂</div>
            <div class="dock-item">🌐</div>
            <div class="dock-item">📷</div>
            <div class="dock-item">🎵</div>
            <div class="dock-item">💬</div>
            <div class="dock-item">📁</div>

            <div class="dock-line"></div>

            <div class="dock-item">🗑️</div>

        </div>

    </main>

    <script src="page2.js"></script>

</body>
</html>
